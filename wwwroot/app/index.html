<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniService — SPA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <style>
        body { font-family: system-ui, "Segoe UI", sans-serif; background:#f2f5fb; }
        .sidebar { width:210px; min-height:100vh; background:#0f1f3d; }
        .sidebar a { color:#9fb0cf; display:block; padding:9px 16px; text-decoration:none; font-size:14px; }
        .sidebar a.active, .sidebar a:hover { color:#fff; background:rgba(37,99,235,.3); border-left:3px solid #2563eb; }
        .brand { color:#fff; font-weight:800; padding:16px; font-size:17px; }
        .card { border:none; box-shadow:0 1px 4px rgba(2,10,40,.07); border-radius:12px; }
        .stat { font-size:26px; font-weight:800; }
        code.api { background:#eef; padding:1px 6px; border-radius:4px; font-size:12px; }
    </style>
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-tools"></i> MiniService <span class="badge bg-primary" style="font-size:9px">SPA</span></div>
        <a href="#/dashboard" data-r="dashboard"><i class="bi bi-speedometer2 me-1"></i> Bảng điều khiển</a>
        <a href="#/ros" data-r="ros"><i class="bi bi-clipboard-check me-1"></i> Lệnh sửa chữa</a>
        <a href="#/customers" data-r="customers"><i class="bi bi-people me-1"></i> Khách hàng</a>
        <a href="/swagger" target="_blank" style="border-top:1px solid #1c2c4d;margin-top:8px"><i class="bi bi-braces me-1"></i> API (Swagger)</a>
        <a href="/" style="color:#5f6f8f"><i class="bi bi-arrow-left me-1"></i> UI cũ (Razor)</a>
    </nav>
    <div class="flex-fill">
        <div class="bg-white border-bottom px-4 py-2 d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold" id="title">Bảng điều khiển</h6>
            <span class="small text-muted">API: <code class="api" id="lastapi">—</code></span>
        </div>
        <div class="p-4" id="view">Đang tải…</div>
    </div>
</div>

<script>
const API = '/api/v1';
const el = document.getElementById('view');
const fmtM = n => (n||0).toLocaleString('vi-VN') + 'đ';
function setTitle(t){ document.getElementById('title').textContent = t; }
async function api(path, opts){
    document.getElementById('lastapi').textContent = (opts?.method||'GET') + ' ' + API + path;
    const r = await fetch(API + path, { headers:{'Content-Type':'application/json'}, ...opts });
    if(!r.ok){ let e; try{e=await r.json()}catch{e={error:r.status}} throw new Error(e.error||e.msg||('HTTP '+r.status)); }
    return r.status===204 ? null : r.json();
}
function nav(){ document.querySelectorAll('.sidebar a[data-r]').forEach(a=>a.classList.toggle('active', location.hash.startsWith('#/'+a.dataset.r))); }

const routes = {
  dashboard: async () => {
    setTitle('Bảng điều khiển');
    const d = await api('/dashboard');
    el.innerHTML = `<div class="row g-3 mb-3">
      ${card('RO đang mở', d.openRO, '#2563eb')}${card('Đang sửa', d.inGarage, '#f59e0b')}
      ${card('Xong hôm nay', d.doneToday, '#16a34a')}${card('Doanh thu tháng', fmtM(d.revenueMonth), '#0f766e', true)}</div>
      <div class="card"><div class="card-body"><h6 class="fw-bold">RO theo trạng thái</h6>
      ${(d.byStatus||[]).map(s=>`<div class="d-flex justify-content-between small border-bottom py-1"><span>${s.statusText}</span><b>${s.count}</b></div>`).join('')||'<span class="text-muted">—</span>'}</div></div>`;
  },
  ros: async () => {
    setTitle('Lệnh sửa chữa');
    const rows = await api('/ros');
    el.innerHTML = `<div class="card"><div class="card-body">
      <table class="table table-hover align-middle mb-0"><thead><tr><th>Mã</th><th>Biển số</th><th>Khách</th><th class="text-end">Tổng</th><th>Trạng thái</th><th>HĐĐT</th></tr></thead><tbody>
      ${rows.map(r=>`<tr style="cursor:pointer" onclick="location.hash='#/ro/${r.id}'">
        <td class="fw-semibold">${r.code}</td><td>${r.plate||''}</td><td class="small">${r.customer||''}</td>
        <td class="text-end">${fmtM(r.total)}</td><td><span class="badge bg-secondary">${r.statusText}</span></td>
        <td>${r.eInvoice?'<span class="badge bg-success">'+r.eInvoice+'</span>':'<span class="text-muted small">—</span>'}</td></tr>`).join('')||'<tr><td colspan=6 class="text-center text-muted py-3">Chưa có RO</td></tr>'}
      </tbody></table></div></div>`;
  },
  ro: async (id) => {
    const r = await api('/ros/'+id); setTitle('RO ' + r.code);
    el.innerHTML = `<div class="row g-3"><div class="col-lg-8"><div class="card"><div class="card-body">
      <h5 class="fw-bold">${r.code} <span class="badge bg-secondary">${r.statusText}</span></h5>
      <div class="text-muted small mb-2">${r.car.plate} · ${r.car.model} · KH: ${r.customer.name} (${r.customer.phone||''})</div>
      <table class="table table-sm"><thead><tr><th>Loại</th><th>Nội dung</th><th class="text-end">SL</th><th class="text-end">Đơn giá</th><th class="text-end">Thành tiền</th></tr></thead><tbody>
      ${r.lines.map(l=>`<tr><td>${l.type===0?'Công':'Phụ tùng'}</td><td>${l.name}</td><td class="text-end">${l.quantity}</td><td class="text-end">${fmtM(l.unitPrice)}</td><td class="text-end">${fmtM(l.amount)}</td></tr>`).join('')||'<tr><td colspan=5 class="text-muted">Chưa có dòng</td></tr>'}
      </tbody><tfoot><tr class="fw-bold"><td colspan=4 class="text-end">TỔNG</td><td class="text-end" style="color:#1d4ed8">${fmtM(r.total)}</td></tr></tfoot></table>
      </div></div></div>
      <div class="col-lg-4"><div class="card mb-3"><div class="card-body"><h6 class="fw-bold">Chuyển trạng thái</h6>
      ${r.allowedNext.map(n=>`<button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="doTransition(${id},${n.value})">${n.text}</button>`).join('')||'<div class="text-muted small">Kết thúc.</div>'}
      </div></div>
      <div class="card"><div class="card-body"><h6 class="fw-bold">Hóa đơn điện tử</h6>
      ${r.eInvoice.code?`<div class="alert alert-success py-2 small">Mã CQT: <b>${r.eInvoice.code}</b></div><a class="btn btn-sm btn-outline-primary w-100" target="_blank" href="https://minitvan.onrender.com/Lookup/${r.eInvoice.code}">Tra cứu T-VAN</a>`
        : `${r.eInvoice.error?'<div class="alert alert-danger py-2 small">'+r.eInvoice.error+'</div>':''}<button class="btn btn-primary btn-sm w-100" ${r.total<=0?'disabled':''} onclick="issueInv(${id})">Xuất HĐĐT (${fmtM(r.total)})</button>`}
      </div></div></div></div>
      <a href="#/ros" class="btn btn-link mt-2">← Danh sách</a>`;
  },
  customers: async () => {
    setTitle('Khách hàng (data thật)');
    const q = new URLSearchParams(location.hash.split('?')[1]||'').get('q')||'';
    const rows = await api('/customers'+(q?'?q='+encodeURIComponent(q):''));
    el.innerHTML = `<div class="card"><div class="card-body">
      <input class="form-control form-control-sm mb-3" style="max-width:280px" placeholder="Tìm tên/mã…" value="${q}" onchange="location.hash='#/customers?q='+encodeURIComponent(this.value)">
      <table class="table table-hover align-middle mb-0"><thead><tr><th>Mã</th><th>Tên</th><th>SĐT</th><th>Địa chỉ</th><th>MST</th><th>Đại lý</th></tr></thead><tbody>
      ${rows.map(c=>`<tr><td class="small">${c.code}</td><td class="fw-semibold">${esc(c.name)}</td><td>${c.phone||''}</td><td class="small text-muted">${esc(c.address||'')}</td><td class="small">${c.taxCode||''}</td><td class="small">${c.dealerCode||''}</td></tr>`).join('')||'<tr><td colspan=6 class="text-center text-muted py-3">Chưa có</td></tr>'}
      </tbody></table><div class="small text-muted mt-2">${rows.length} khách hàng.</div></div></div>`;
  }
};
function card(t,v,c,sm){ return `<div class="col-6 col-lg-3"><div class="card"><div class="card-body"><div class="text-muted small">${t}</div><div class="stat" style="color:${c};${sm?'font-size:18px':''}">${v}</div></div></div></div>`; }
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
window.doTransition = async (id,to)=>{ try{ const r=await api('/ros/'+id+'/transition',{method:'POST',body:JSON.stringify({to})}); toast(r.msg); render(); }catch(e){ toast('❌ '+e.message);} };
window.issueInv = async (id)=>{ try{ toast('Đang đẩy HĐĐT…'); const r=await api('/ros/'+id+'/einvoice',{method:'POST'}); toast(r.msg); render(); }catch(e){ toast('❌ '+e.message);} };
function toast(m){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;font-size:14px';document.body.appendChild(t);} t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3500); }

async function render(){
  nav();
  const h = location.hash.replace('#/','') || 'dashboard';
  const [path] = h.split('?'); const parts = path.split('/');
  try {
    if(parts[0]==='ro' && parts[1]) await routes.ro(parts[1]);
    else if(routes[parts[0]]) await routes[parts[0]]();
    else await routes.dashboard();
  } catch(e){ el.innerHTML = '<div class="alert alert-danger">Lỗi: '+e.message+'</div>'; }
}
window.addEventListener('hashchange', render);
if(!location.hash) location.hash = '#/dashboard';
render();
</script>
</body>
</html>
